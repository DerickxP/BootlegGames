<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BootlegGames - Loja</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    
<div class="social-fixed">
    <a id="sf-github" href="https://github.com/DerickxP" target="_blank" title="GitHub">
        <i class="fab fa-github"></i>
    </a>
    <a id="sf-linkedin" href="https://www.linkedin.com/in/derickportela/" target="_blank" title="LinkedIn">
        <i class="fab fa-linkedin-in"></i>
    </a>
    <a id="sf-instagram" href="https://www.instagram.com/derickportela_/" target="_blank" title="Instagram">
        <i class="fab fa-instagram"></i>
    </a>
</div>

<header class="header">
    <div class="left">
        <h1>BootlegGames</h1>
        <nav class="menu">
            <a href="index.html">Loja</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </div>

    <div class="right">
        <img id="avatar" class="avatar" src="img/avatar_gamer.svg">
        <span id="user-badge" class="badge">PLAYER</span>
        <button id="logout" class="btn small">Sair</button>
    </div>
</header>

<section class="hero">
    <div class="hero-inner">
        <div>
            <h2 id="hero-title">Bem-vindo à BootlegGames</h2>
            <p id="hero-sub">Se é pirata, é aqui que joga! Porque pagar é overrated.</p>
        </div>
        <img src="img/banner.jpg" class="banner" alt="">
    </div>
</section>

<main class="main-grid">
    <aside class="sidebar">
        <div class="card card-sidebar">
            <h4>Filtros</h4>
            <label>Pesquisar
                <input id="search" type="search" placeholder="Buscar jogos...">
            </label>
            <label>Categoria
                <select id="filter">
                    <option value="all">Todas</option>
                    <option value="rpg">RPG</option>
                    <option value="ação">Ação</option>
                    <option value="indie">Indie</option>
                    <option value="terror">Terror</option>
                    <option value="sobrevivência">Sobrevivência</option>
                </select>
            </label>
        </div>
    </aside>

    <section class="content">
        <div class="catalog-header">
            <h3>Catálogo</h3>
            <button id="btn-refresh" class="btn">Atualizar</button>
        </div>
        <div id="products" class="products-grid"></div>

        <div id="admin-panel" class="admin-panel card hidden">
            <h4>Adicionar novo jogo (Admin)</h4>
            <form id="form-add">
                <input name="nome" placeholder="Nome" required>
                <input name="categoria" placeholder="Categoria" required>
                <input name="preco" type="number" step="0.01" required>
                <input name="estoque" type="number" required>
                <input name="img" placeholder="img/imagem.jpg">
                <textarea name="descricao" placeholder="Descrição"></textarea>
                <button class="btn">Adicionar</button>
            </form>
        </div>
    </section>
</main>

<section id="detalhes" class="detalhes hidden">
    <button id="btn-voltar-lista" class="btn outline">← Voltar</button>
    <div id="detalhes-content" class="card"></div>
</section>

<footer class="site-footer">
    <div class="footer-inner">
        <div>BootlegGames © 2025</div>
        <div class="socials">
            <a id="link-github" href="https://github.com/andersnruann" target="_blank" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a id="link-linkedin" href="http://www.linkedin.com/in/ruan-anderson-b4957a330" target="_blank" title="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a id="link-instagram" href="https://instagram.com/" target="_blank" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>
</footer>

<script src="js/script-cards.js"></script>

</body>
</html>
